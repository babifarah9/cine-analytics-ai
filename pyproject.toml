[project]
name = "cine-analytics-ai"
version = "1.0.0"
description = "Autonomous Multi-Agent AI Director & Real-Time Box Office / Streaming Telemetry Command Center powered by Gemini & ClickHouse"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "google-genai>=0.1.1",
    "clickhouse-connect>=0.7.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pytest>=8.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "evals"]

